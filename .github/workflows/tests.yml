name: Laravel Automated Tests

on:
  push:
    branches: [ "**" ] # Berjalan di semua branch
  pull_request:
    branches: [ "**" ] # Berjalan untuk PR ke semua branch

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, dom, filter, libxml, json, phar
        coverage: none

    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: Install Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Generate key
      run: php artisan key:generate

    - name: Run Migrations
      env:
        DB_CONNECTION: mysql
        DB_DATABASE: testing_db
        DB_PORT: 3306
        DB_USER: root
        DB_PASSWORD: password
      run: php artisan migrate -q --no-ansi --no-interaction

    - name: Execute tests (Unit and Feature tests) via PHPUnit
      env:
        DB_CONNECTION: mysql
        DB_DATABASE: testing_db
        DB_PORT: 3306
        DB_USER: root
        DB_PASSWORD: password
      run: php artisan test
